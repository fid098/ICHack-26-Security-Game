server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths must fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
